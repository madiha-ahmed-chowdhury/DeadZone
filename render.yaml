services:
  - type: web
    name: deadzone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BACKEND_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"        # tighten to the deployed frontend's origin after first deploy
      - key: DEADZONE_DRY_RUN
        value: "false"

  - type: web
    name: deadzone-web
    runtime: static
    rootDir: frontend
    buildCommand: ""       # no build step — plain HTML/CSS/JS
    staticPublishPath: .

  # The Telegram bot runs as a separate worker process (long-polling), not
  # behind an HTTP port, so it's a background worker rather than a web service.
  - type: worker
    name: deadzone-bot
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.telegram_bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_BASE_URL
        value: https://deadzone-api.onrender.com
      - key: BACKEND_API_KEY
        fromService:
          type: web
          name: deadzone-api
          envVarKey: BACKEND_API_KEY
